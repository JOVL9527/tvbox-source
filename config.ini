; =============================================================================
; TVBox 直播源聚合配置模板  config.ini
; -----------------------------------------------------------------------------
; 读取者：tvbox_builder.py（纯标准库实现，无需 pip 安装任何依赖）
; 编码：UTF-8。修改后重新执行 `python tvbox_builder.py` 即生效。
;
; 命名兼容说明：
;   subscribe_urls / domain_blacklist / urls_limit / ipv_type 这 4 个参数
;   与 Guovin/TV（原 iptv-api）、LazyImmortal/TVLiveSource 等主流项目同名同义，
;   如果你以后想换成那些项目，直接把本文件的对应项复制过去即可。
; =============================================================================

[global]
; ---- 总开关 ----------------------------------------------------------------
; 关闭后脚本只做「读本地源 + 生成结果」，不发起任何网络抓取与测速
open_update = True
; 生成结果的 txt 中每个频道后面是否追加说明信息（$ 后内容：来源|分辨率|协议）
; 部分播放器（如 PotPlayer）解析不了会导致不能播，故默认关闭
open_url_info = False
; 结果顶部是否插入更新时间行（形如 「更新时间,2026-10-16 06:00:03」）
open_update_time = True
; 是否同时生成 m3u 格式结果（output/result.m3u，带台标）
open_m3u_result = True

[source]
; ---- 网络订阅源 ------------------------------------------------------------
; 多个地址用英文逗号分隔，支持 m3u / txt(m3u8) 两种格式。
; 也可以留空，改为在 config/subscribe.txt 里每行一个（推荐，便于加注释和 UA）。
subscribe_urls = https://raw.githubusercontent.com/Guovin/TV/gd/output/result.txt, https://raw.githubusercontent.com/bestK/iptv/main/iptv.txt, https://raw.githubusercontent.com/YueChan/Live/main/IPTV.m3u, https://raw.githubusercontent.com/YanG-1989/m3u/main/Gather.m3u, https://raw.githubusercontent.com/suxuang/myIPTV/main/ipv4.m3u
; 订阅源清单文件（每行一个地址，支持 `地址 UA="xxx"` 写法；# 开头为注释）
subscribe_file = config/subscribe.txt
; 本地源模板：这里列出的频道一定会出现在结果里，且顺序优先；file:// 或 http 均可
source_file = config/demo.txt
; 本地补充源（可选），格式与 result.txt 完全相同，用于手工钉住某个稳定地址
local_file = config/local.txt

; ---- 黑名单 ----------------------------------------------------------------
; 域名黑名单：只要 URL 里包含其中任意一段字符串就丢弃（子串匹配，不必写全域名）
; 例：写 epg.pw 可以同时命中 http://epg.pw/xx 和 https://cdn.epg.pw/yy
domain_blacklist = epg.pw, ad.example.com, track.example.com, 127.0.0.1, 0.0.0.0, localhost
; 关键字黑名单：URL 或频道名里出现这些词就丢弃（用于干掉广告、测试占位、付费墙）
url_keywords_blacklist = 广告, 测试, 推广, 收费, 破解, vip解析, porn
; 独立黑名单文件（每行一个域名/关键字）
blacklist_file = config/blacklist.txt
; 频道名黑名单：整条频道直接不要（支持子串匹配）
channel_blacklist = 福利, 加群

; ---- 数量与质量阈值 ---------------------------------------------------------
; urls_limit：每个频道最终保留几个源。同一个频道按「分辨率优先、其次响应时间」排序后截断
urls_limit = 5
; 生成结果中接口的协议类型，可选值：ipv4 / ipv6 / all
;   ipv4 —— 只保留 IPv4 地址（兼容性最好，家用宽带首选）
;   ipv6 —— 只保留 IPv6 地址（干净、码率高，但需要宽带支持 IPv6）
;   all  —— 两者都保留
ipv_type = ipv4
; 协议偏好：结果里把哪一类排前面，可选值：ipv4 / ipv6 / auto
ipv_type_prefer = auto
; 最小分辨率过滤，可选值：0（不过滤）/ 720 / 1080 / 2160
; 只有能拿到 m3u8 主播放列表、且带 RESOLUTION= 标记的源才能识别分辨率
min_resolution = 0
; 响应时间阈值（毫秒），超过该值的源直接丢弃；0 表示不限制
max_response_time = 3000
; 单个源的探测超时（秒）。调大能拿到更多源但整体耗时线性增长
probe_timeout = 4
; 并发探测线程数。GitHub Actions 上建议 32~64，家用小机器建议 16
probe_workers = 48
; 每轮最多探测多少个候选地址（防止订阅源爆量把 runner 跑爆），0 表示不限制
max_candidates = 3000
; 单次请求订阅源文件的超时（秒）
request_timeout = 15
; 全局 UA —— 部分直播源服务端会校验 UA
user_agent = okhttp/Mursor-1.4.0.0

[filter]
; 自动停用连续抓取失败（请求报错 / 内容为空）的订阅源：
; 开启后会在 config/subscribe.txt 对应行前加 # 注释掉，并写入 config/cdn_fallback.txt 记录
open_auto_disable_source = False
; 订阅源内容为空时的 CDN 代理回退前缀（按顺序尝试，任一成功即停）
cdn_url = https://gh-proxy.com/, https://mirror.ghproxy.com/
; HTTP 代理，留空不使用（形如 http://127.0.0.1:7890）
http_proxy =

[output]
; 生成的 txt 结果（TVBox / 影视仓 / 电视家 等直接可用的直播源格式）
final_file = output/result.txt
; 生成的 m3u 结果
final_m3u_file = output/result.m3u
; 生成的 TVBox 配置（含 lives 直播菜单 + sites 点播菜单，直接作为 TVBox 的「配置地址」使用）
source_json = output/source.json
; 生成的纯点播配置（只有 sites/spider/parses，方便单独使用）
sites_json = output/sites.json
; 详细日志与统计报告
log_file = output/update.log
report_file = output/report.json
; 频道分类菜单定义文件（决定菜单顺序与归类规则）
category_file = config/category.txt
; source.json 里 lives 指向的在线地址前缀。
; 部署到 GitHub 后改成 https://raw.githubusercontent.com/你的用户名/仓库名/main
; 部署到自己的服务器后改成 https://你的域名 （末尾不要带 /）
; 留空则写入本地相对路径，仅本机播放器可用
publish_base_url = publish_base_url = https://raw.githubusercontent.com/JOVL9527/tvbox-source/main


; ============================================================================
; 点播（非直播）源配置
; ----------------------------------------------------------------------------
; TVBox 配置里 sites 就是点播：每一条是一个「影视资源站」。
;   type 1 = CMS JSON 采集接口（苹果CMS 风格 api.php/provide/vod/），可以 HTTP 校验
;   type 3 = 内置 csp_XXX 或 js 源，依赖 spider 爬虫包，无法单独 HTTP 校验
;   type 0 = 爬虫/嗅探源，同样依赖 spider
; 因此本工具对 type=1 做真校验，对其余类型做「跨源去重 + 原样保留」。
; ============================================================================
[sites]
; 开启点播源聚合
open_sites = True
; 点播源聚合来源：公开 TVBox 配置(JSON)，逗号分隔。
; 会从中提取 sites（点播站）、spider（爬虫包）、parses（解析接口）、flags（线路标记）
sites_source_urls = https://raw.githubusercontent.com/qist/tvbox/master/jsm.json, https://raw.githubusercontent.com/qist/tvbox/master/dianshi.json, https://raw.githubusercontent.com/qist/tvbox/master/367.json, https://raw.githubusercontent.com/qist/tvbox/master/XYQ.json, https://raw.githubusercontent.com/gaotianliuyun/gao/master/0821.json, https://raw.githubusercontent.com/gaotianliuyun/gao/master/js.json
; 聚合来源清单文件（每行一个地址，便于加注释）
sites_source_file = config/sites_source.txt
; 手工维护的点播源（每行：名称,type,api[,ext] 或直接一行 JSON），优先排在结果最前
sites_file = config/sites.txt
; 点播源总数上限，0 表示不限。TVBox 站点过多会拖慢加载，建议 100~200
sites_limit = 150
; 对 type=1 的 CMS 接口做 ac=list 有效性校验，校验失败的直接丢弃
probe_sites = True
; CMS 接口校验超时（秒）
sites_probe_timeout = 6
; 点播源名称黑名单（子串匹配）
sites_keywords_blacklist = 广告, 加群, 收费, 试看
; 需要强制排除的 api 地址片段（被多个公开源联播的失效接口可写这里）
sites_api_blacklist =
; spider 爬虫包地址；留空则从聚合来源里自动选出「出现次数最多」的那个并解析成绝对地址
spider =
; 是否允许自动选择 spider
open_auto_spider = True
; parses（解析接口）保留数量上限
parses_limit = 40


[schedule]
; 下面两项只用于说明「定时」是怎么触发的，脚本本身不读取它们：
;   1) GitHub Actions —— 由 .github/workflows/update.yml 里的 cron 控制，见该文件
;   2) 自己的服务器 —— 由系统 crontab / systemd timer 控制，见 README.md
; 这里只是把时间点记录下来，方便你两边保持一致。
; 每日执行时间（24 小时制，Asia/Shanghai）
daily_time = 06:00
; 等价的 cron 表达式（本地服务器 crontab 用，UTC 服务器请自行减 8 小时）
cron = 0 6 * * *
; 时区
time_zone = Asia/Shanghai
